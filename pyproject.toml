[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testorcode"
version = "0.1.0"
description = "Intent-grounded triage of CI test failures with scoped change memory and test-integrity checking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "rank-bm25>=0.2.2,<1",
    "pandas>=2.2,<4",
    "python-dotenv>=1.0,<2",
    "openai>=1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "pip-tools>=7.4,<8",
]
embeddings = [
    "sentence-transformers>=3,<6",
]
mutation = [
    "mutmut>=3,<4",
]
report = [
    "matplotlib>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/testorcode"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py312"
